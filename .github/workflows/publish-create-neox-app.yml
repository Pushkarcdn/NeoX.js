name: Publish create-neox-app

on:
  push:
    branches:
      - main
    paths:
      - ".npm/create-neox-app/**"
      - ".github/workflows/publish-create-neox-app.yml"

jobs:
  publish-create-neox-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./.npm/create-neox-app/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: check-version
        run: |
          if npm view create-neox-app-beta@${{ steps.package-version.outputs.version }} version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.package-version.outputs.version }} already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.package-version.outputs.version }} is new"
          fi

      - name: Wait for neox.js CDN propagation
        if: steps.check-version.outputs.exists == 'false'
        run: |
          echo "⏳ Waiting 5 minutes for neox.js to propagate across npm CDN..."
          echo "This ensures neox.js@${{ steps.package-version.outputs.version }} is available globally"
          sleep 300
          echo "✅ Wait complete. Verifying neox.js availability..."
          npm view neox.js@${{ steps.package-version.outputs.version }} version || echo "⚠️ Warning: neox.js@${{ steps.package-version.outputs.version }} not found"

      - name: Publish create-neox-app to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: |
          cd .npm/create-neox-app
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip Publishing
        if: steps.check-version.outputs.exists == 'true'
        run: echo "⏭️ Skipping publish - version ${{ steps.package-version.outputs.version }} already exists on npm"
