name: Publish NeoX.js

on:
  push:
    branches:
      - main

env:
  FOLDER_NAME: neox.js
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Prepare template directory
        run: |
          cp -r .npm/common/* .npm/${{ env.FOLDER_NAME }}/
          mkdir -p .npm/${{ env.FOLDER_NAME }}/template
          rsync -a --exclude='.github' --exclude='.npm' --exclude='.git' . .npm/${{ env.FOLDER_NAME }}/template/
          # Rename .gitignore to gitignore (npm doesn't publish dotfiles by default)
          if [ -f .npm/${{ env.FOLDER_NAME }}/template/.gitignore ]; then
            mv .npm/${{ env.FOLDER_NAME }}/template/.gitignore .npm/${{ env.FOLDER_NAME }}/template/gitignore
          fi

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./.npm/${{ env.FOLDER_NAME }}/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: check-version
        run: |
          if npm view ${{ env.FOLDER_NAME }}@${{ steps.package-version.outputs.version }} version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.package-version.outputs.version }} already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.package-version.outputs.version }} is new"
          fi

      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish
        working-directory: .npm/${{ env.FOLDER_NAME }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Create Git Tag
        if: steps.check-version.outputs.exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ env.FOLDER_NAME }}-v${{ steps.package-version.outputs.version }}" -m "Release ${{ env.FOLDER_NAME }}-v${{ steps.package-version.outputs.version }}"
          git push origin "${{ env.FOLDER_NAME }}-v${{ steps.package-version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Skip Publishing
        if: steps.check-version.outputs.exists == 'true'
        run: echo "⏭️ Skipping publish - version ${{ steps.package-version.outputs.version }} already exists on npm"
